services:
  event-agent:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGINGFACE_TOKEN=#PASTE HUGGINGFACE TOKEN HERE <-----
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    build: .
    ports:
     - "8000:8000"
    volumes:
     - .:/appW